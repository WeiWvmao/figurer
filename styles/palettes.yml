  direction_3:
    type: categorical
    colors:
      negative: "#3B73B9"
      neutral: "#BDBDBD"
      positive: "#D64A4A"

policy:
  - Use semantic identity colors when a category has a stable biological meaning.
  - Use categorical palettes for arbitrary groups without biological identity.
  - Prefer perceptually ordered sequential palettes for continuous non-negative variables.
  - Prefer centered diverging palettes only when a meaningful midpoint exists.
  - Do not use rainbow/jet for quantitative values.