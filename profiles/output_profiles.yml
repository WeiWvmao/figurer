policy:
  - Dimensions are defaults, not journal-specific mandates.
  - Override height when the scientific layout requires it; preserve profile typography unless there is a clear reason not to.
  - For raster-heavy spatial figures, use 300-600 dpi according to physical size and file-size constraints.
  - For line art, prefer PDF/SVG rather than relying on high DPI.